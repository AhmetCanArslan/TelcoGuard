version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: case1_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: case1_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - case1_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: case1_app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: case1_db
      DB_SSLMODE: disable
      SERVER_PORT: 3000
      SERVER_HOST: 0.0.0.0
      ENV: development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - case1_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  case1_network:
    driver: bridge
